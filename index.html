:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f4f5;background:#101820;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:920px;margin:auto;padding:18px 16px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;font-size:25px;letter-spacing:1.5px}.logo span{color:#ff962e}.sub{font-size:12px;color:#9eabb4}.pill{border:1px solid #35434c;border-radius:99px;padding:7px 10px;color:#c5cdd2;font-size:12px}.nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#17222b;border-top:1px solid #34414a;display:flex;justify-content:center;padding:8px 4px max(8px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#9ba9b4;flex:1;max-width:160px;padding:9px 1px;font-size:11px}.nav button.active{color:#ff9d3d}.nav b{display:block;font-size:21px;margin-bottom:4px}.card{background:#1a2731;border:1px solid #32414b;border-radius:17px;padding:17px;margin:14px 0}.hero{background:linear-gradient(125deg,#273746,#17232c);border-left:4px solid #ff932a}.muted{color:#9eacb6;font-size:13px}.title{font-size:22px;font-weight:800;margin:23px 0 10px}h3{margin:0 0 12px}.btn{border:0;background:#ff982e;color:#1c1c1c;font-weight:800;padding:12px 16px;border-radius:10px}.secondary{background:#2b3a45;color:#edf2f5}.danger{background:#542c2c;color:#ffdbdb}.small{padding:8px 11px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:14px;border-radius:12px;background:#12202a}.metric strong{display:block;font-size:22px;color:#ffab52}.metric span{font-size:12px;color:#a6b4be}.vehicle{display:flex;gap:13px;align-items:center}.vehicle img{width:94px;height:80px;object-fit:cover;border-radius:11px;background:#273947}.vehicle .info{flex:1;min-width:0}.vehicle h3{margin:0 0 4px;overflow-wrap:anywhere}.line{border-top:1px solid #33414a;padding:11px 0}.line:first-child{border-top:0}.flex{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{color:#ffb35d;background:#4a3625;padding:5px 9px;border-radius:99px;font-size:12px}.ok{color:#a8e3c2;background:#214438}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:13px;color:#c9d2d8}.form input,.form select,.form textarea{width:100%;border:1px solid #42515c;border-radius:9px;background:#101c25;color:white;padding:12px;min-width:0}.form textarea{min-height:75px}.form input[type=file]{padding:9px}.form input[type=checkbox]{width:auto}.modal{position:fixed;inset:0;z-index:10;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:22px 12px}.modal.show{display:flex}.dialog{width:min(100%,580px);background:#1a2731;border:1px solid #4a5963;border-radius:16px;padding:19px;margin:auto}.dialog .flex{margin-bottom:14px}.empty{text-align:center;color:#9fb0bb;padding:26px 12px}.notice{padding:12px;background:#3a3025;border-left:3px solid #ff9b36;border-radius:8px;margin:9px 0;font-size:13px}.chartrow{display:grid;grid-template-columns:65px 1fr 82px;gap:9px;align-items:center;margin:12px 0;font-size:12px}.track{height:14px;background:#283945;border-radius:6px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ff8928,#ffb760)}.hide{display:none!important}a{color:#ffae59} .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#31483c;color:#e6fff0;padding:12px 18px;border-radius:9px;z-index:30;display:none;max-width:95vw} @media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><div id="toast" class="toast"></div><main class="wrap"><header class="top"><div><div class="logo">TANK<span>LOG</span> <span style="font-size:12px;color:#aab5bc">1.3</span></div><div class="sub">DEIN DIGITALES FAHRZEUGBUCH</div></div><div class="pill">● LOKAL & OFFLINE</div></header><div id="view"></div></main><nav class="nav" id="nav"></nav><div class="modal" id="modal"><div class="dialog"><div class="flex"><h3 id="modalTitle"></h3><button class="btn secondary small" onclick="closeModal()">✕ Schließen</button></div><div id="modalBody"></div></div></div><script>
'use strict';const DB='tanklog-v1';let db, state={vehicles:[],fuel:[],service:[]},tab='garage',selected='all';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const today=()=>new Date().toISOString().slice(0,10);const num=v=>Number(String(v??'').replace(',','.'))||0;const money=v=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v||0);const nfmt=v=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}).format(v||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE'):'–';const veh=id=>state.vehicles.find(x=>x.id===id);const vname=id=>veh(id)?.name||'Unbekanntes Fahrzeug';function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{for(let s of ['vehicles','fuel','service'])r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function all(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(store,obj){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function reload(){for(let s of ['vehicles','fuel','service'])state[s]=await all(s);render()}function vfilter(arr){return selected==='all'?arr:arr.filter(x=>x.vehicleId===selected)}function choose(){return `<select id="filter" onchange="selected=this.value;render()"><option value="all">Alle Fahrzeuge</option>${state.vehicles.map(v=>`<option value="${esc(v.id)}" ${selected===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`}function nav(){let items=[['garage','🚙','Garage'],['fuel','⛽','Tanken'],['service','🔧','Wartung'],['stats','📊','Statistik'],['backup','💾','Backup']];$('nav').innerHTML=items.map(([id,ico,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><b>${ico}</b>${label}</button>`).join('')}function render(){nav();let html={garage:garage,fuel:fuelView,service:serviceView,stats:statsView,backup:backupView}[tab]();$('view').innerHTML=html}function currentKm(id){let v=veh(id);return Math.max(num(v?.km),...state.fuel.filter(x=>x.vehicleId===id).map(x=>num(x.km)),...state.service.filter(x=>x.vehicleId===id&&x.km!==null&&x.km!==undefined).map(x=>num(x.km)),0)}function due(v){let out=[];for(let s of state.service.filter(x=>x.vehicleId===v.id&&x.type==='Ölwechsel').sort((a,b)=>b.date.localeCompare(a.date)||num(b.km)-num(a.km)).slice(0,1)){let left=s.nextKm?num(s.nextKm)-currentKm(v.id):null;let days=s.nextDate?Math.ceil((new Date(s.nextDate+'T12:00:00')-new Date())/86400000):null;if((left!==null&&left<=1000)||(days!==null&&days<=30))out.push(`Ölwechsel ${left!==null?(left<=0?'km-Intervall überschritten':`in ${nfmt(left)} km`):''} ${days!==null?(days<=0?'Termin überschritten':`/ in ${days} Tagen`):''}`)}if(v.hu&&new Date(v.hu+'T12:00:00')-new Date()<45*86400000)out.push('HU/TÜV bis '+dt(v.hu));return out}function dueDateAlerts(){
 const day=today(),alerts=[];
 for(const v of state.vehicles){
  if(v.hu&&v.hu<=day)alerts.push({id:'hu:'+v.id+':'+v.hu,vehicle:v.name,label:'HU / TÜV',date:v.hu});
  const entries=state.service.filter(x=>x.vehicleId===v.id&&x.nextDate&&x.nextDate<=day);
  const latest=new Map();
  for(const x of entries){const key=x.type||'Wartung',prev=latest.get(key);if(!prev||x.date>prev.date||(x.date===prev.date&&x.nextDate>prev.nextDate))latest.set(key,x)}
  for(const x of latest.values()){
   // HU dates are already managed on the vehicle; avoid duplicate alerts.
   if(x.type==='HU/TÜV')continue;
   alerts.push({id:'service:'+x.id+':'+x.nextDate,vehicle:v.name,label:x.type||'Wartung',date:x.nextDate});
  }
 }
 return alerts.sort((a,b)=>a.date.localeCompare(b.date));
}
function alertsPanel(){const a=dueDateAlerts();return a.length?`<div class="card" style="border-color:#ff982e"><h3>🔔 ${a.length} fällige Erinnerung${a.length===1?'':'en'}</h3>${a.map(x=>`<div class="notice"><b>${esc(x.vehicle)} · ${esc(x.label)}</b><br>Fällig seit ${dt(x.date)}</div>`).join('')}<div class="muted">Termine aktualisieren, sobald sie erledigt sind.</div></div>`:''}
function showDuePopup(){const a=dueDateAlerts();if(!a.length)return;const key='tanklog-due-seen:'+today();let seen=[];try{seen=JSON.parse(sessionStorage.getItem(key)||'[]')}catch(e){}const fresh=a.filter(x=>!seen.includes(x.id));if(!fresh.length)return;
 sessionStorage.setItem(key,JSON.stringify([...new Set([...seen,...fresh.map(x=>x.id)])]));
 modal('🔔 Wartung / TÜV fällig',`<p>Für deine Fahrzeuge sind folgende Termine erreicht oder überschritten:</p>${fresh.map(x=>`<div class="notice"><b>${esc(x.vehicle)}</b><br>${esc(x.label)} · ${dt(x.date)}</div>`).join('')}<div class="muted">Die Meldung erscheint beim Öffnen der App. Es werden keine Push-Nachrichten bei geschlossener App verschickt.</div><div class="actions"><button class="btn" type="button" onclick="closeModal();tab='garage';render()">Verstanden</button></div>`);
}
function garage(){return `<div class="title">Meine Garage</div>${alertsPanel()}<div class="card hero"><div class="muted">FAHRZEUGE</div><div style="font-size:32px;font-weight:900">${state.vehicles.length}</div><div class="muted">Alles im Blick. Alle Daten bleiben auf diesem Gerät.</div><div class="actions"><button class="btn" onclick="vehicleForm()">＋ Fahrzeug anlegen</button></div></div>${state.vehicles.length?state.vehicles.map(v=>`<div class="card"><div class="vehicle">${v.photo?`<img src="${v.photo}" alt="Fahrzeug">`:'<div style="font-size:44px">🚙</div>'}<div class="info"><h3>${esc(v.name)}</h3><div class="muted">${esc(v.plate||'Ohne Kennzeichen')} · ${nfmt(currentKm(v.id))} km</div><div class="muted">${esc(v.fuelType||'')}</div></div></div>${due(v).map(t=>`<div class="notice">🔔 ${esc(t)}</div>`).join('')}<div class="actions">${v.schein?`<button class="btn secondary small" onclick="showSchein('${v.id}')">📄 Fahrzeugschein</button>`:''}<button class="btn small" onclick="entryForm('fuel','${v.id}')">＋ Tanken</button><button class="btn secondary small" onclick="entryForm('service','${v.id}')">＋ Wartung</button><button class="btn secondary small" onclick="vehicleForm('${v.id}')">Bearbeiten</button><button class="btn danger small" onclick="removeVehicle('${v.id}')">Löschen</button></div></div>`).join(''):'<div class="card empty">Noch keine Fahrzeuge. Lege dein erstes Fahrzeug an.</div>'}`}function vehicleOptions(id){return state.vehicles.map(v=>`<option value="${v.id}" ${id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}function fuelView(){let a=vfilter(state.fuel).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="title">Tankbuch</div><div class="actions"><button class="btn" onclick="entryForm('fuel')">＋ Tankvorgang</button></div><div class="card"><label class="muted">Fahrzeugfilter</label>${choose()}</div>${a.length?a.map(x=>`<div class="card"><div class="flex"><b>${esc(vname(x.vehicleId))}</b><span class="muted">${dt(x.date)}</span></div><div style="font-size:22px;font-weight:800;margin:10px 0">${nfmt(x.liters)} L · ${money(x.total)}</div><div class="muted">${nfmt(x.km)} km · ${x.full?'Vollgetankt':'Teilbetankung'} ${x.station?'· '+esc(x.station):''}</div><div class="actions"><button class="btn secondary small" onclick="entryForm('fuel',null,'${x.id}')">Bearbeiten</button><button class="btn danger small" onclick="removeEntry('fuel','${x.id}')">Löschen</button></div></div>`).join(''):'<div class="card empty">Noch keine Tankvorgänge.</div>'}`}function serviceView(){let a=vfilter(state.service).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="title">Wartung & Reparaturen</div><div class="actions"><button class="btn" onclick="entryForm('service')">＋ Eintrag</button></div><div class="card"><label class="muted">Fahrzeugfilter</label>${choose()}</div>${a.length?a.map(x=>`<div class="card"><div class="flex"><b>${esc(x.type)}</b><span class="muted">${dt(x.date)}</span></div><div class="muted">${esc(vname(x.vehicleId))} · ${x.km===null||x.km===undefined?"ohne km-Angabe":nfmt(x.km)+" km"}</div><div style="font-size:22px;font-weight:800;margin:10px 0">${money(x.cost)}</div>${x.notes?`<div class="muted">${esc(x.notes)}</div>`:''}${x.nextKm||x.nextDate?`<div class="notice">Nächster Termin: ${x.nextKm?nfmt(x.nextKm)+' km':''} ${x.nextDate?dt(x.nextDate):''}</div>`:''}${x.receipt?`<div class="actions"><button class="btn secondary small" onclick="showReceipt('${x.id}')">📷 Beleg ansehen</button></div>`:''}<div class="actions"><button class="btn secondary small" onclick="entryForm('service',null,'${x.id}')">Bearbeiten</button><button class="btn danger small" onclick="removeEntry('service','${x.id}')">Löschen</button></div></div>`).join(''):'<div class="card empty">Noch keine Wartungseinträge.</div>'}`}function consumption(id){let a=state.fuel.filter(x=>x.vehicleId===id).sort((a,b)=>num(a.km)-num(b.km));let prev=null,liters=0,dist=0;for(let x of a){if(x.full){if(prev&&num(x.km)>num(prev.km)){let segment=a.filter(y=>num(y.km)>num(prev.km)&&num(y.km)<=num(x.km));liters+=segment.reduce((s,y)=>s+num(y.liters),0);dist+=num(x.km)-num(prev.km)}prev=x}}return dist>0?100*liters/dist:null}function statsView(){let f=vfilter(state.fuel),s=vfilter(state.service),costFuel=f.reduce((n,x)=>n+num(x.total),0),costService=s.reduce((n,x)=>n+num(x.cost),0),byMonth={};for(let x of [...f.map(y=>({...y,cost:y.total})),...s]){let m=x.date?.slice(0,7)||'–';byMonth[m]=(byMonth[m]||0)+num(x.cost)}let months=Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);let max=Math.max(...months.map(x=>x[1]),1);return `<div class="title">Statistiken</div><div class="card">${choose()}</div><div class="grid"><div class="metric"><strong>${money(costFuel)}</strong><span>Kraftstoff</span></div><div class="metric"><strong>${money(costService)}</strong><span>Wartung</span></div><div class="metric"><strong>${money(costFuel+costService)}</strong><span>Gesamtkosten</span></div><div class="metric"><strong>${f.length}</strong><span>Tankvorgänge</span></div></div><div class="card"><h3>Kosten pro Monat</h3>${months.length?months.map(([m,val])=>`<div class="chartrow"><span>${esc(m)}</span><div class="track"><div class="bar" style="width:${val/max*100}%"></div></div><b>${money(val)}</b></div>`).join(''):'<div class="empty">Noch keine Daten</div>'}</div><div class="card"><h3>Durchschnittsverbrauch</h3><div class="muted">Berechnung zwischen zwei Volltankungen; Teilbetankungen dazwischen werden berücksichtigt. Kilometerstände müssen korrekt und fortlaufend sein.</div>${state.vehicles.filter(v=>selected==='all'||v.id===selected).map(v=>`<div class="line flex"><span>${esc(v.name)}</span><b>${consumption(v.id)===null?'Noch nicht berechenbar':nfmt(consumption(v.id))+' L/100 km'}</b></div>`).join('')}</div>`}function backupView(){return `<div class="title">Datensicherung</div><div class="card hero"><h3>💾 Vollständiges Backup</h3><p class="muted">Speichert alle Fahrzeuge, Tank- und Wartungseinträge sowie Fahrzeugfotos und Belegbilder in einer JSON-Datei. Bewahre sie sicher auf.</p><div class="actions"><button class="btn" onclick="exportBackup()">⬇ Backup herunterladen</button><button class="btn secondary" onclick="$('importFile').click()">⬆ Backup importieren</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0])"></div></div><div class="card"><h3>📊 Excel / CSV</h3><p class="muted">Drei CSV-Dateien für Fahrzeuge, Tankvorgänge und Wartungen. CSV enthält keine Bilder. Für vollständige Wiederherstellung bitte das JSON-Backup nutzen.</p><div class="actions"><button class="btn secondary" onclick="exportCSV()">CSV-Dateien herunterladen</button></div></div><div class="card"><h3>ℹ️ Speicherort</h3><p class="muted">Alle Einträge liegen in der lokalen Datenbank dieses Browsers bzw. dieser installierten App. GitHub Pages speichert deine Einträge nicht. Löschen von Browserdaten, Deinstallation oder Geräteverlust kann die Daten entfernen.</p><div class="notice">Empfehlung: Nach Änderungen regelmäßig ein Backup auf dem Computer speichern. Der Import ersetzt den gesamten Datenbestand – nicht zusammenführen!</div><div class="muted">Daten: ${state.vehicles.length} Fahrzeuge · ${state.fuel.length} Tankvorgänge · ${state.service.length} Wartungen</div></div>`}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function field(label,name,type='text',value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function parseScheinText(raw){
 const t=String(raw||'').replace(/\r/g,'').toUpperCase();
 const find=(re)=>{let m=t.match(re);return m?m[1].trim():''};
 let make=find(/\b(AUDI|VOLKSWAGEN|VW|BMW|MERCEDES(?:-BENZ)?|OPEL|FORD|SKODA|SEAT|TOYOTA|HYUNDAI|KIA|RENAULT|PEUGEOT|FIAT|PORSCHE)\b/);
 let model=find(/\b(A[3468]\s+(?:ALLROAD\s+QUATTRO|AVANT)|A[3468]\s+AVANT|GOLF|PASSAT|TIGUAN|OCTAVIA|C-KLASSE)\b/);
 let first=find(/(?:^|\s)(\d{2}\.\d{2}\.\d{4})(?:\s|$)/);
 let plate=find(/\b([A-ZÄÖÜ]{1,3}[ -][A-Z]{1,2}[ -]?\d{1,4})\b/);
 let vin=find(/\b([A-HJ-NPR-Z0-9]{17})\b/);
 let power=find(/(?:P\.?2|LEISTUNG)\s*[:\-]?\s*(\d{2,3})\b/);
 let engine=find(/(?:P\.?1|HUBRAUM)\s*[:\-]?\s*(\d{3,4})\b/);
 let fuel=/HYBR|BENZIN\s*\/\s*E/.test(t)?'Hybrid':/DIESEL/.test(t)?'Diesel':/BENZIN/.test(t)?'Benzin':/ELEKTRO/.test(t)?'Elektro':'';
 let hu=find(/(?:NÄCHSTE\s+HU|HU\s*TERMIN)\s*[:\-]?\s*(\d{2}\.\d{4})/);
 let hsn=find(/(?:2\.?1|HSN)\s*[:\-]?\s*(\d{4})\b/);
 let tsn=find(/(?:2\.?2|TSN)\s*[:\-]?\s*([A-Z0-9]{3,8})\b/);
 return {make,model,first,plate,vin,power,engine,fuel,hu,hsn,tsn};
}
let ocrLoader=null;
function loadOCR(){
 if(window.Tesseract)return Promise.resolve(window.Tesseract);
 if(ocrLoader)return ocrLoader;
 ocrLoader=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(Error('OCR-Bibliothek nicht verfügbar'));
  script.onerror=()=>reject(Error('OCR-Bibliothek konnte nicht geladen werden (Internetverbindung prüfen)'));
  document.head.appendChild(script);
 }).catch(e=>{ocrLoader=null;throw e});
 return ocrLoader;
}
async function scanSchein(input){
 const file=input.files?.[0];if(!file)return;
 const status=$('scanStatus');status.textContent='Bild wird vorbereitet …';
 try{
  if(file.size>20e6)throw Error('Datei zu groß (max. 20 MB)');
  const picture=await imageData(file);
  $('scheinPreview').src=picture;$('scheinPreview').classList.remove('hide');$('scheinData').value=picture;
  status.textContent='OCR wird geladen – beim ersten Mal ist Internet erforderlich …';
  const T=await loadOCR();
  let worker;
  try{
   worker=await T.createWorker('deu+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='Fahrzeugschein wird gelesen: '+Math.round((m.progress||0)*100)+' %';else if(m.status)status.textContent='OCR: '+m.status;}});
   const result=await worker.recognize(picture);
   const recognized=result.data.text||'';
   if(!recognized.trim())throw Error('Kein Text erkannt. Bitte ein schärferes Foto verwenden.');
   $('scanText').value=recognized;
   applyScheinText();
   status.textContent='Texterkennung abgeschlossen. Bitte jedes Feld prüfen und bei Bedarf korrigieren.';
  }finally{if(worker)await worker.terminate()}
 }catch(e){status.textContent='Automatische Erkennung fehlgeschlagen: '+e.message+'. Bild ist vorgemerkt; du kannst Felder manuell ausfüllen.';}
}
function applyScheinText(){
 const form=$('editor'),v=parseScheinText($('scanText').value);
 const set=(key,val)=>{if(val&&form.elements[key])form.elements[key].value=val};
 set('name',[v.make,v.model].filter(Boolean).join(' '));set('plate',v.plate);set('vin',v.vin);
 set('powerKw',v.power);set('engineCc',v.engine);set('hsn',v.hsn);set('tsn',v.tsn);
 if(v.first){let parts=v.first.split('.');set('firstRegistration',parts[2]+'-'+parts[1]+'-'+parts[0]);set('year',parts[2])}
 if(v.fuel)set('fuelType',v.fuel);
 if(v.hu){let a=v.hu.split('.');set('hu',a[1]+'-'+a[0]+'-01')}
 $('scanStatus').textContent='Erkannte Daten übernommen. Bitte prüfen und gegebenenfalls korrigieren. HU-Monat ist nur ein Monatswert.';
}
function showSchein(id){let v=veh(id);if(v?.schein)modal('Fahrzeugschein · '+v.name,`<img alt="Gespeicherter Fahrzeugschein" src="${v.schein}" style="max-width:100%;border-radius:10px"><p class="muted">Lokal gespeichert. Im vollständigen JSON-Backup enthalten.</p>`)}
function vehicleForm(id){let v=veh(id)||{};
modal(id?'Fahrzeug bearbeiten':'Fahrzeug anlegen',`<form class="form" id="editor">
<div class="notice"><b>📄 Fahrzeugschein importieren</b><p class="muted">Foto aufnehmen oder Bild auswählen. Die automatische Texterkennung nutzt Tesseract direkt im Browser. Beim ersten Scan ist Internet zum Laden des OCR-Modells nötig. Es werden keine Fahrzeugscheine an TANKLOG-Server hochgeladen. Bitte alle Angaben kontrollieren.</p><input type="file" id="scheinFile" accept="image/*" capture="environment" onchange="scanSchein(this)"><input type="hidden" id="scheinData"><img id="scheinPreview" class="hide" alt="Vorschau Fahrzeugschein" style="width:100%;max-height:220px;object-fit:contain;margin-top:10px"><div id="scanStatus" class="muted"></div><details style="margin-top:10px"><summary>Erkannten Text einfügen / manuell zuordnen</summary><textarea id="scanText" placeholder="Optional: Text aus einer Texterkennungs-App einfügen" style="width:100%;min-height:90px;margin-top:8px"></textarea><button type="button" class="btn secondary small" onclick="applyScheinText()">Erkannten Text in Felder übernehmen</button></details></div>
${field('Name / Marke und Modell *','name','text',v.name,'required')}${field('Kennzeichen','plate','text',v.plate)}${field('Erstzulassung','firstRegistration','date',v.firstRegistration)}${field('Baujahr','year','number',v.year,'min="1900" max="2100"')}${field('FIN / Fahrgestellnummer','vin','text',v.vin)}${field('HSN','hsn','text',v.hsn)}${field('TSN','tsn','text',v.tsn)}${field('Leistung (kW)','powerKw','number',v.powerKw,'min="0"')}${field('Hubraum (cm³)','engineCc','number',v.engineCc,'min="0"')}${field('Kilometerstand','km','number',v.km,'min="0" step="1"')}<label>Kraftstoffart<select name="fuelType">${['Benzin','Diesel','Elektro','Hybrid','LPG','Sonstiges'].map(t=>`<option ${v.fuelType===t?'selected':''}>${t}</option>`).join('')}</select></label>${field('Nächste HU / TÜV (Datum)','hu','date',v.hu)}<label>Fahrzeugfoto (optional)<input type="file" name="photo" accept="image/*"></label><button class="btn" type="submit">Fahrzeug speichern (Daten vorher prüfen)</button></form>`);
$('editor').onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(e.target);let photo=fd.get('photo').size?await imageData(fd.get('photo')):v.photo||'';let schein=$('scheinData').value||v.schein||'';let vin=String(fd.get('vin')||'').trim().toUpperCase();if(vin&&state.vehicles.some(x=>x.id!==id&&String(x.vin||'').toUpperCase()===vin)){alert('Diese FIN ist bereits bei einem anderen Fahrzeug gespeichert. Bitte prüfen.');return}
let data={...v,id:id||uid(),name:String(fd.get('name')).trim(),plate:fd.get('plate'),year:fd.get('year'),firstRegistration:fd.get('firstRegistration'),vin,hsn:fd.get('hsn'),tsn:fd.get('tsn'),powerKw:fd.get('powerKw'),engineCc:fd.get('engineCc'),km:num(fd.get('km')),fuelType:fd.get('fuelType'),hu:fd.get('hu'),photo,schein};await put('vehicles',data);closeModal();await reload();toast('Fahrzeug und Fahrzeugschein gespeichert')}catch(err){alert('Speichern fehlgeschlagen: '+err.message)}}}
function entryForm(kind,vehicleId,id){
 if(!state.vehicles.length){alert('Bitte zuerst ein Fahrzeug anlegen.');tab='garage';render();return}
 let old=(kind==='fuel'?state.fuel:state.service).find(x=>x.id===id)||{};
 let vId=old.vehicleId||vehicleId||(selected!=='all'&&veh(selected)?selected:state.vehicles[0].id);
 let types=['Ölwechsel','Inspektion','Reparatur','Reifen','Bremsen','HU/TÜV','Versicherung','Steuer','Sonstiges'];
 let body=`<form class="form" id="editor"><label>Fahrzeug<select name="vehicleId" required>${vehicleOptions(vId)}</select></label><div id="vehicleHint" class="muted"></div>${field('Datum','date','date',old.date||today(),'required')}`;
 if(kind==='fuel'){
  body+=`<div id="kmBlock">${field('Kilometerstand *','km','number',old.km??currentKm(vId),'min="0" required')}</div>${field('Getankte Liter *','liters','number',old.liters,'min="0.01" step="0.01" required')}${field('Preis je Liter (€)','price','number',old.price,'min="0" step="0.001"')}${field('Gesamtbetrag (€) *','total','number',old.total,'min="0" step="0.01" required')}${field('Tankstelle','station','text',old.station)}<label><span><input name="full" type="checkbox" ${old.full!==false?'checked':''}> Vollgetankt</span></label>`;
 }else{
  body+=`<label>Art<select name="type">${types.map(t=>`<option ${old.type===t?'selected':''}>${t}</option>`).join('')}</select></label><div id="kmBlock">${field('Kilometerstand (optional)','km','number',old.km??'','min="0"')}</div>${field('Kosten (€)','cost','number',old.cost,'min="0" step="0.01"')}<div id="nextKmBlock">${field('Nächste Wartung bei (km, optional)','nextKm','number',old.nextKm,'min="0"')}</div><div id="nextDateBlock">${field('Nächster Termin / Fälligkeit','nextDate','date',old.nextDate)}</div><label>Notizen<textarea name="notes">${esc(old.notes)}</textarea></label><label>Rechnung / Beleg als Bild<input name="receipt" type="file" accept="image/*"></label>`;
 }
 body+='<button class="btn" type="submit">Eintrag speichern</button></form>';
 modal(id?'Eintrag bearbeiten':kind==='fuel'?'Tanken erfassen':'Wartung erfassen',body);
 let form=$('editor'),vehicleSelect=form.elements.vehicleId,kmInput=form.elements.km;
 function updateForm(){let v=veh(vehicleSelect.value),t=kind==='service'?form.elements.type.value:'Tanken';
  $('vehicleHint').textContent=v?`${v.name}${v.plate?' · '+v.plate:''} · letzter bekannter Stand: ${nfmt(currentKm(v.id))} km`:'';
  let kmNeeded=kind==='fuel',kmUseful=['Ölwechsel','Inspektion','Reifen','Bremsen'].includes(t);
  $('kmBlock').classList.toggle('hide',!kmNeeded&&!kmUseful&&t!=='Reparatur'&&t!=='Sonstiges');
  kmInput.required=kmNeeded;
  if(kind==='service'){$('nextKmBlock').classList.toggle('hide',!kmUseful);}
 }
 vehicleSelect.addEventListener('change',()=>{if(!id&&kind==='fuel')kmInput.value=currentKm(vehicleSelect.value);updateForm()});
 if(kind==='service')form.elements.type.addEventListener('change',updateForm);
 updateForm();
 form.onsubmit=async e=>{e.preventDefault();try{
  let f=new FormData(form),type=kind==='service'?f.get('type'):'',isKmVisible=!$('kmBlock').classList.contains('hide');
  let kmValue=kind==='fuel'?num(f.get('km')):(isKmVisible&&f.get('km')!==''?num(f.get('km')):null);
  let obj={...old,id:id||uid(),vehicleId:f.get('vehicleId'),date:f.get('date'),km:kmValue};
  if(kind==='fuel')Object.assign(obj,{liters:num(f.get('liters')),price:num(f.get('price')),total:num(f.get('total')),station:f.get('station'),full:f.has('full')});
  else {let nextKmVisible=!$('nextKmBlock').classList.contains('hide');Object.assign(obj,{type,cost:num(f.get('cost')),nextKm:nextKmVisible&&f.get('nextKm')!==''?num(f.get('nextKm')):null,nextDate:f.get('nextDate'),notes:f.get('notes'),receipt:f.get('receipt').size?await imageData(f.get('receipt')):old.receipt||''});
   if(type==='HU/TÜV'&&f.get('nextDate')){let v=veh(obj.vehicleId);await put('vehicles',{...v,hu:f.get('nextDate')})}
  }
  await put(kind,obj);closeModal();await reload();toast('Eintrag gespeichert')
 }catch(err){alert('Speichern fehlgeschlagen: '+err.message)}}
}
function imageData(file){return new Promise((resolve,reject)=>{if(file.size>20e6)return reject(Error('Bild zu groß (max. 20 MB)'));let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1200/img.width,1200/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.75))};img.onerror=()=>reject(Error('Bild konnte nicht gelesen werden'));img.src=reader.result};reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}async function removeVehicle(id){if(!confirm('Fahrzeug und ALLE zugehörigen Tank- und Wartungseinträge löschen?'))return;for(let kind of ['fuel','service'])for(let x of state[kind].filter(x=>x.vehicleId===id))await del(kind,x.id);await del('vehicles',id);if(selected===id)selected='all';await reload()}async function removeEntry(kind,id){if(confirm('Eintrag wirklich löschen?')){await del(kind,id);await reload()}}function showReceipt(id){let x=state.service.find(x=>x.id===id);if(x?.receipt)modal('Belegbild',`<img src="${x.receipt}" alt="Beleg" style="max-width:100%;border-radius:10px">`)}function download(filename,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}function exportBackup(){let data={format:'tanklog-backup',version:1,exportedAt:new Date().toISOString(),...state};download('TANKLOG-Backup-'+today()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}));toast('Backup erstellt – bitte sicher aufbewahren')}async function importBackup(file){if(!file)return;try{let d=JSON.parse(await file.text());if(d.format!=='tanklog-backup'||d.version!==1||!['vehicles','fuel','service'].every(k=>Array.isArray(d[k])))throw Error('Keine gültige TANKLOG-Backup-Datei');if(!confirm(`Backup vom ${dt(d.exportedAt?.slice(0,10))} importieren? ALLE aktuellen Daten auf diesem Gerät werden dadurch ersetzt. Bitte vorher ein eigenes Backup exportieren!`))return;let tx=db.transaction(['vehicles','fuel','service'],'readwrite');for(let k of ['vehicles','fuel','service']){let s=tx.objectStore(k);s.clear();for(let x of d[k]){if(!x.id)throw Error('Ungültiger Eintrag');s.put(x)}}await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});selected='all';await reload();toast('Backup erfolgreich importiert')}catch(err){alert('Import fehlgeschlagen: '+err.message)}finally{$('importFile').value=''}}function csvCell(x){let v=String(x??'');return '"'+v.replace(/"/g,'""')+'"'}function exportCSV(){let sheets=[['Fahrzeuge',state.vehicles,['name','plate','year','firstRegistration','vin','hsn','tsn','powerKw','engineCc','km','fuelType','hu']],['Tanken',state.fuel,['vehicleId','date','km','liters','price','total','station','full']],['Wartung',state.service,['vehicleId','date','km','type','cost','nextKm','nextDate','notes']]];for(let [name,arr,fields] of sheets){let lines=[fields.map(csvCell).join(';'),...arr.map(o=>fields.map(k=>csvCell(o[k])).join(';'))];download('TANKLOG-'+name+'-'+today()+'.csv',new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}))}toast('CSV-Exporte gestartet')}async function init(){try{db=await openDB();await reload();showDuePopup();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('view').innerHTML='<div class="card">Lokale Speicherung konnte nicht geöffnet werden. Bitte privaten Browsermodus verlassen und Speicherzugriff erlauben.</div>';console.error(e)}}init();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db){render();showDuePopup()}});
</script></body></html>
